name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Unique per push commit so queued main runs are never replaced; per PR otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ci/required
    runs-on: docker
    timeout-minutes: 30
    services:
      # Not "postgres": shared runner networks may already carry that alias for another database.
      innerscape-ci-db:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: innerscape
          POSTGRES_PASSWORD: innerscape
          POSTGRES_DB: innerscape
    env:
      DATABASE_URL: postgresql://innerscape:innerscape@innerscape-ci-db:5432/innerscape
    container:
      image: node:26-bookworm@sha256:5c4012d11d9857c42713ba511fbc19645cac1706bb710d51d42b0d301dff7f88
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/backend

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Lint all workspaces
        run: npm run lint --workspaces --if-present

      - name: Agent surface tests (CLI and stdio MCP server)
        run: npm run test:tools

      - name: Wait for the Postgres service to accept connections
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/innerscape-ci-db/5432) 2>/dev/null; then echo "postgres ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "postgres did not become ready in 60s"; exit 1
      - name: Push schema to test database
        working-directory: apps/backend
        run: npx prisma db push

      - name: Integration tests (backend)
        run: npm test --workspace=apps/backend

      # Layer 5: self-description consistency (shared tooling checkout).
      - name: Check out the shared CI tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: KyaniteLabs/.github
          ref: d99e9be1830d5e29d1d8f0ba1722997d3dd2184f
          path: .l5-tools
          persist-credentials: false
      - name: Layer 5 self-description consistency
        shell: bash
        run: |
          set -uo pipefail
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          script=".l5-tools/scripts/self_description_check.py"
          [ -f "$script" ] || { echo "self-description check script missing" >&2; exit 1; }
          rc=0
          python3 "$script" . || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gate evidence: self-description check not applicable here"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

  hermes-plugin:
    name: ci/hermes-plugin
    runs-on: docker
    timeout-minutes: 10
    env:
      TANSTACK_QUERY_CORE: ${{ github.workspace }}/.ci-query-core/node_modules/@tanstack/query-core
      HERMES_V023_SOURCE: ${{ github.workspace }}/.ci-hermes-v023
      HERMES_V023_TUI_SOURCE: ${{ github.workspace }}/.ci-hermes-v023
    container:
      image: python:3.11-slim-bookworm@sha256:a83ba18aef0f865b1a4a611c2cf460fe446f2795673bbb9fe43be570439e3b39
    steps:
      - name: Install checkout runtime (actions/checkout needs node + git)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs npm ca-certificates
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Forgejo resolves `repository:` against this server, so fetch Hermes from GitHub by commit.
      - name: Fetch the tested Hermes runtime (v0.23.0, pinned by commit)
        run: |
          git init -q .ci-hermes-v023
          git -C .ci-hermes-v023 fetch -q --depth 1 https://github.com/NousResearch/hermes-agent 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          git -C .ci-hermes-v023 checkout -q FETCH_HEAD
      - name: Install pinned query-core for Desktop regression test
        run: mkdir -p .ci-query-core && cd .ci-query-core && echo '{"private":true}' > package.json && npm install --no-save --package-lock=false --ignore-scripts @tanstack/query-core@5.104.1
      - name: Install the test runner (FastAPI for the Desktop page's routes)
        run: python -m pip install --no-cache-dir -q "pytest==8.4.2" "fastapi==0.115.6" "httpx==0.28.1"
      - name: Hermes plugin tests (fake Innerscape API, vendored Hermes v0.21.6 session context)
        working-directory: plugins/innerscape-hermes
        run: python -m pytest tests -q
      - name: Desktop half (plugin.js, stubbed SDK)
        working-directory: plugins/innerscape-hermes/desktop
        # Debian's Node 18 can't detect ESM from a .js name, so syntax-check an .mjs copy.
        run: node --version && cp plugin.js "$RUNNER_TEMP/plugin.mjs" && node --check "$RUNNER_TEMP/plugin.mjs" && node --test tests/plugin.test.mjs
