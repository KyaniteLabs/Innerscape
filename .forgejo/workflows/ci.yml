name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Unique per push commit so queued main runs are never replaced; per PR otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ci/required
    runs-on: docker
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: innerscape
          POSTGRES_PASSWORD: innerscape
          POSTGRES_DB: innerscape
    env:
      DATABASE_URL: postgresql://innerscape:innerscape@postgres:5432/innerscape
    container:
      image: node:26-bookworm@sha256:5c4012d11d9857c42713ba511fbc19645cac1706bb710d51d42b0d301dff7f88
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/backend

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Lint all workspaces
        run: npm run lint --workspaces --if-present

      - name: Wait for the Postgres service to accept connections
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; then echo "postgres ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "postgres did not become ready in 60s"; exit 1
      - name: Push schema to test database
        working-directory: apps/backend
        run: npx prisma db push

      - name: Integration tests (backend)
        run: npm test --workspace=apps/backend

      # Layer 5: self-description consistency (shared tooling checkout).
      - name: Check out the shared CI tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: KyaniteLabs/.github
          ref: d99e9be1830d5e29d1d8f0ba1722997d3dd2184f
          path: .l5-tools
          persist-credentials: false
      - name: Layer 5 self-description consistency
        shell: bash
        run: |
          set -uo pipefail
          command -v python3 >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3; }
          script=".l5-tools/scripts/self_description_check.py"
          [ -f "$script" ] || { echo "self-description check script missing" >&2; exit 1; }
          rc=0
          python3 "$script" . || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gate evidence: self-description check not applicable here"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
