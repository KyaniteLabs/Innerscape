name: Hermes plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hermes-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the test runner (FastAPI for the Desktop page's routes)
        run: python -m pip install --no-cache-dir -q "pytest==8.4.2" "fastapi==0.115.6" "httpx==0.28.1"
      - name: Run the plugin tests
        run: python -m pytest plugins/innerscape-hermes/tests -q -p no:cacheprovider
      - name: Desktop half (plugin.js, stubbed SDK)
        working-directory: plugins/innerscape-hermes/desktop
        run: node --version && node --check plugin.js && node --test tests/plugin.test.mjs
