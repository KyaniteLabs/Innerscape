name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: innerscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/innerscape_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm audit --audit-level=high
        working-directory: .
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsc --noEmit
      - run: npm test

  # Moved from Forgejo CI when GitHub became the only CI (GIT-CI-STRATEGY-20261123):
  # the all-workspace build and lint, and the Layer 5 self-description check.
  workspaces:
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the schema's env(); nothing connects to it here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate --workspace=apps/backend
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - name: Check out the shared CI tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KyaniteLabs/.github
          ref: a9070204d393afce800230b4eefc809569b45a4a
          path: .l5-tools
          persist-credentials: false
      - name: Layer 5 self-description consistency
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          python3 .l5-tools/scripts/self_description_check.py . || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gate evidence: self-description check not applicable here"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

  mobile-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build --workspace=packages/shared
        working-directory: .
      - run: npx tsc --noEmit

  agent-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI and MCP server have no dependencies, so no install step.
      - run: npm run test:tools

  hermes-plugin:
    runs-on: ubuntu-latest
    env:
      TANSTACK_QUERY_CORE: ${{ github.workspace }}/.ci-query-core/node_modules/@tanstack/query-core
      HERMES_V023_SOURCE: ${{ github.workspace }}/.ci-hermes-v023
      HERMES_V023_TUI_SOURCE: ${{ github.workspace }}/.ci-hermes-v023
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: mkdir -p .ci-query-core && cd .ci-query-core && echo '{"private":true}' > package.json && npm install --no-save --package-lock=false --ignore-scripts @tanstack/query-core@5.104.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 # Hermes v0.23.0
          path: .ci-hermes-v023
          persist-credentials: false
      - run: python -m pip install pytest fastapi httpx
      - run: python3 -m pytest plugins/innerscape-hermes/tests -q
      - run: node --test plugins/innerscape-hermes/desktop/tests/plugin.test.mjs
