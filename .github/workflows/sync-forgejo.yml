name: Sync Forgejo mirror

# GitHub is this repo's trunk; the Forgejo copy (KyaniteLabs/Innerscape) is a read-only
# mirror. After trunk CI passes on main, the shared workflow fast-forwards
# the mirror to that exact commit (fleet GIT-CI-STRATEGY-20261123). Off until
# the repo variable FORGEJO_SYNC_ACTIVE is 'true'; dry-run until a mirror
# token is set. See KyaniteLabs/.github docs/sync-forgejo.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-forgejo-main
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FORGEJO_SYNC_ACTIVE == 'true' && github.event.workflow_run.conclusion == 'success'
    uses: KyaniteLabs/.github/.github/workflows/sync-forgejo.yml@main
    with:
      trunk: main
      trigger-workflow-id: 271217865
      trigger-workflow-name: "CI"
      trigger-workflow-path: .github/workflows/ci.yml
      required-workflows: |
        271217865:.github/workflows/ci.yml
      forgejo-repository: KyaniteLabs/Innerscape
      downstream-workflow: none
      dry-run: true
    secrets: inherit
